<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Driver Login - SmartWaste</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .login-form {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #dc2626;
        }

        .error-message.active {
            display: block;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #22c55e;
        }

        .success-message.active {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #e5e7eb;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-text {
            font-size: 0.9em;
            color: #6b7280;
            text-align: center;
            margin-top: 15px;
        }

        .demo-credentials {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.85em;
            border-left: 4px solid #667eea;
        }

        .demo-credentials p {
            color: #374151;
            margin-bottom: 5px;
        }

        .demo-credentials strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Truck Driver Portal</h1>
            <p>SmartWaste Management System</p>
        </div>

        <div class="login-form">
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="driverId">Driver ID</label>
                    <input 
                        type="text" 
                        id="driverId" 
                        placeholder="Enter your driver ID" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="truckId">Truck ID</label>
                    <select id="truckId" required>
                        <option value="">Select your truck</option>
                        <option value="T001">T001 - Ramesh Kumar</option>
                        <option value="T002">T002 - Ravi Singh</option>
                        <option value="T003">T003 - Yallappa</option>
                        <option value="T004">T004 - Pradeep Kumar</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password" 
                        required
                    >
                </div>

                <button type="submit" class="login-button" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Authenticating...</p>
            </div>

            <div class="info-text">
                After login, you'll scan QR code and facial recognition
            </div>

            <div class="demo-credentials">
                <p><strong>Demo Credentials:</strong></p>
                <p>Driver ID: D001</p>
                <p>Password: driver123</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3002/api';
        let driverSession = null;

        // Handle login
        async function handleLogin(event) {
            event.preventDefault();
            
            const driverId = document.getElementById('driverId').value.trim();
            const truckId = document.getElementById('truckId').value.trim();
            const password = document.getElementById('password').value;

            if (!driverId || !truckId || !password) {
                showError('Please fill all fields');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loginBtn').disabled = true;

            try {
                // Call backend API
                const response = await fetch(`${API_BASE}/auth/driver-login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        driverId: driverId,
                        truckId: truckId,
                        password: password
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    showError(data.message || 'Login failed');
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('loginBtn').disabled = false;
                    return;
                }

                // Save session with complete driver data
                driverSession = {
                    id: data.driver.id,
                    name: data.driver.name,
                    truckId: data.driver.truckId,
                    phone: data.driver.phone,
                    aadharNumber: data.driver.aadharNumber,
                    gender: data.driver.gender,
                    caste: data.driver.caste,
                    email: data.driver.email,
                    token: data.token,
                    timestamp: new Date()
                };

                sessionStorage.setItem('driverSession', JSON.stringify(driverSession));
                showSuccess('Login successful! Redirecting to attendance...');

                // Redirect to attendance page
                setTimeout(() => {
                    window.location.href = 'driver-attendance.html';
                }, 1500);

            } catch (error) {
                console.error('Login error:', error);
                showError('Failed to login. Please try again.');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('loginBtn').disabled = false;
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
            setTimeout(() => errorDiv.classList.remove('active'), 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('active');
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            const session = sessionStorage.getItem('driverSession');
            if (session) {
                // Already logged in, redirect to attendance
                window.location.href = 'driver-attendance.html';
            }
        });
    </script>
</body>
</html>
